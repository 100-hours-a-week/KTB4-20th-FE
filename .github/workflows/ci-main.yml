name: FE Main CI

on:
  push:
    branches: [main]

concurrency:
  group: frontend-main-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: planit/frontend

jobs:
  publish:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tag: ${{ steps.image.outputs.tag }}
      publish_attempt: ${{ steps.image.outputs.publish_attempt }}
    name: Build and Publish Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=/api \
            -t planit-frontend:ci .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '577483323183'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag planit-frontend:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"

          echo "### Published frontend image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve published image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DIGEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy and Verify
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
      PUBLISH_ATTEMPT: ${{ needs.publish.outputs.publish_attempt }}
      INSTANCE_ID: ${{ vars.CD_INSTANCE_ID }}
      DOCUMENT_VERSION: ${{ vars.CD_SSM_DOCUMENT_VERSION }}
      DOCUMENT_NAME: Planit-Deploy-frontend
      SERVICE: frontend
    steps:
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '577483323183'

      - name: Request deployment and verify result
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$DOCUMENT_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          # Only structured parameters are accepted; no remote shell commands from the runner.
          jq -n \
            --arg digest "$IMAGE_DIGEST" --arg tag "$IMAGE_TAG" \
            --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$PUBLISH_ATTEMPT" --arg sequence "$GITHUB_RUN_NUMBER" \
            '{imageDigest:[$digest], imageTag:[$tag], commitSha:[$commit],
              runId:[$run], runAttempt:[$attempt], releaseSequence:[$sequence]}' \
            > "$RUNNER_TEMP/deploy-parameters.json"

          # Do not retry send-command automatically: an uncertain response may already have executed.
          COMMAND_ID=$(AWS_MAX_ATTEMPTS=1 aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" \
            --document-version "$DOCUMENT_VERSION" \
            --parameters "file://$RUNNER_TEMP/deploy-parameters.json" \
            --timeout-seconds 120 \
            --comment "PlanIt $SERVICE $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --query 'Command.CommandId' --output text)
          {
            echo "### Deployment: $SERVICE"
            echo "- Image: $ECR_REPOSITORY@$IMAGE_DIGEST"
            echo "- Tag: $IMAGE_TAG"
            echo "- Commit: $GITHUB_SHA"
            echo "- SSM command: $COMMAND_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          # SSM invocation visibility is eventually consistent. Poll the specific instance.
          DEADLINE=$((SECONDS + 2100))
          while (( SECONDS < DEADLINE )); do
            if aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --output json > "$RUNNER_TEMP/invocation.json" \
                2> "$RUNNER_TEMP/invocation-error.txt"; then
              STATUS=$(jq -r '.Status' "$RUNNER_TEMP/invocation.json")
              case "$STATUS" in
                Success)
                  CODE=$(jq -r '.ResponseCode' "$RUNNER_TEMP/invocation.json")
                  [[ "$CODE" == 0 ]]
                  echo '- Result: deployment and verification succeeded' >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                Pending|InProgress|Delayed|Cancelling) ;;
                *)
                  echo "- Result: $STATUS; inspect SSM command $COMMAND_ID" >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::Deployment failed ($STATUS). Check rollback result in the deployment journal."
                  exit 1
                  ;;
              esac
            elif ! grep -q 'InvocationDoesNotExist' "$RUNNER_TEMP/invocation-error.txt"; then
              echo "::error::Unable to read SSM status. Remote execution may still be running; reconcile before retry. Command: $COMMAND_ID"
              exit 1
            fi
            sleep 10
          done
          echo "::error::SSM result is unknown. Inspect $COMMAND_ID and EC2 deployment journal before retrying."
          exit 1
